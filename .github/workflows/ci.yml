name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make check-no-smoke
      - name: Runtime dependency security gate
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: No gitignored files in the repository
        run: |
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then printf '%s\n' "$bad"; exit 1; fi
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - name: Build the MCP runtime once
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mcp
          platforms: linux/amd64
          load: true
          push: false
          tags: transcriptor-candidate:test
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fork-mcp
          cache-to: type=gha,mode=max,scope=fork-mcp
      - name: Verify the exact image without live accounts or network
        run: node scripts/smoke-image.mjs transcriptor-candidate:test
      - name: Verify durable Tasks across processes with synthetic authorization and no network
        run: node scripts/smoke-tasks-image.mjs transcriptor-candidate:test
      - name: Verify source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          revision=$(docker image inspect transcriptor-candidate:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$SOURCE_SHA"
      - uses: docker/login-action@v4
        if: github.repository == 'yusoofsh/transcriptor-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified current-main image
        if: github.repository == 'yusoofsh/transcriptor-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$current" = "$SOURCE_SHA"
          docker tag transcriptor-candidate:test "$IMAGE"
          docker push "$IMAGE"
