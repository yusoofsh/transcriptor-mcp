name: Deploy site
on:
  push:
    branches: [main]
    paths: ['web/**', 'legal/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.ENABLE_SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Deploy to the explicitly configured Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-site --project-name=transcriptor-mcp --branch=main
