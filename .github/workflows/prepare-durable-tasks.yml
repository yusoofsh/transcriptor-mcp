name: Prepare durable Tasks
on:
  push:
    branches: [feat/1.5.20-durable-task-runtime]
    paths: [.github/workflows/prepare-durable-tasks.yml, scripts/prepare-durable-tasks.mjs, src/tasks/**]
permissions:
  contents: write
concurrency:
  group: prepare-durable-tasks
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/transcriptor-mcp' && github.ref == 'refs/heads/feat/1.5.20-durable-task-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply the reviewed opt-in runtime integration
        run: |
          node scripts/prepare-durable-tasks.mjs
          git rm scripts/prepare-durable-tasks.mjs .github/workflows/prepare-durable-tasks.yml
          npx --no-install prettier --write src/tasks src/modern-bridge.ts
      - name: Verify the complete source and security gates
        run: make check-no-smoke && npm audit --omit=dev --audit-level=high
      - name: Commit only validated runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tasks src/modern-bridge.ts .env.example
          git diff --cached --check
          git commit -m 'Enable durable Tasks only behind the existing private authorization contract'
          git push origin HEAD:refs/heads/feat/1.5.20-durable-task-runtime
