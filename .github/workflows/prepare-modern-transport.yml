name: Prepare modern transport
on:
  push:
    branches: [fix/1.5.20-events-upstream-parity]
    paths: [.github/workflows/prepare-modern-transport.yml, scripts/prepare-modern-transport.mjs]
permissions:
  contents: write
concurrency:
  group: prepare-transcriptor-modern
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/transcriptor-mcp' && github.ref == 'refs/heads/fix/1.5.20-events-upstream-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Generate the maintained SDK dependency lock and apply the reviewed adapter
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-exact @modelcontextprotocol/server@2.0.0 @modelcontextprotocol/node@2.0.0
          node scripts/prepare-modern-transport.mjs
          git rm .github/workflows/prepare-modern-transport.yml scripts/prepare-modern-transport.mjs
          npx --no-install prettier --write src/mcp-http.ts src/modern-bridge.ts src/modern-bridge.test.ts package.json
      - name: Verify types, protocol fixtures and runtime dependencies
        run: |
          npm run typecheck
          npx --no-install jest src/modern-bridge.test.ts --runInBand
          npm audit --omit=dev --audit-level=high
      - name: Commit the validated adapter and npm-generated lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp-http.ts src/modern-bridge.ts src/modern-bridge.test.ts package.json package-lock.json
          git diff --cached --check
          git commit -m 'Route modern requests through the maintained SDK without losing fork features'
          git push origin HEAD:refs/heads/fix/1.5.20-events-upstream-parity
