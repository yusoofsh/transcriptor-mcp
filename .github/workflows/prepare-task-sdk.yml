name: Prepare Tasks SDK
on:
  push:
    branches: [feat/1.5.20-durable-task-runtime]
    paths: [.github/workflows/prepare-task-sdk.yml, src/tasks-wire.test.ts]
permissions:
  contents: write
concurrency:
  group: prepare-transcriptor-tasks-sdk
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/transcriptor-mcp' && github.ref == 'refs/heads/feat/1.5.20-durable-task-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Generate the lock from the reviewed released SDK versions
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-exact @modelcontextprotocol/server@2.3.0 @modelcontextprotocol/node@2.1.1
          npx --no-install prettier --write src/tasks-wire.test.ts
          git rm .github/workflows/prepare-task-sdk.yml
      - name: Test native task routing and all existing contracts
        run: make check-no-smoke && npm audit --omit=dev --audit-level=high
      - name: Commit the validated SDK update and fixture only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/tasks-wire.test.ts
          git diff --cached --check
          git commit -m 'Update the native SDK after Tasks and transport checks'
          git push origin HEAD:refs/heads/feat/1.5.20-durable-task-runtime
