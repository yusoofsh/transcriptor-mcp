# The inherited upstream Docker Hub and Registry publisher is not a fork target.
# This fork publishes its verified MCP image through ci.yml, using its own GHCR namespace.
name: Upstream release notice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use the verified main-branch CI image pipeline; no upstream registry writes are performed by this fork.'
